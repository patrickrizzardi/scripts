[project]
name = "dev-helper"
version = "1.0.0"
description = "Interactive development helper menu"
requires-python = ">=3.10"
dependencies = ["questionary>=2.0.1"]

[project.scripts]
dev-helper = "dev_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_helper"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1.380"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
# questionary ships no type stubs; strict mode would otherwise flag every
# prompt call site as an unknown-typed import.
reportMissingTypeStubs = false
